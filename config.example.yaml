# --- Source configs ---
twitter:
  enabled: true
  nitter_instances:
    - https://nitter.privacydev.net
    - https://nitter.poast.org

youtube:
  enabled: true
  api_key: ""         # Optional: YouTube Data API v3 key

reddit:
  enabled: true
  subreddits:
    - MachineLearning
    - artificial
    - LocalLLaMA
    - ChatGPT
    - ClaudeAI

rss:
  enabled: true
  feeds:
    - url: https://openai.com/blog/rss.xml
      name: OpenAI Blog
    - url: https://www.anthropic.com/feed.xml
      name: Anthropic Blog
    - url: https://hnrss.org/newest?q=AI+agent
      name: Hacker News AI

news:
  enabled: true
  newsapi_key: ""     # Optional: newsapi.org key

# --- Analysis (Claude API) ---
analysis:
  anthropic_api_key: ""   # Your Anthropic API key for auto-analysis
  model: "claude-sonnet-4-20250514"
  max_tokens: 4096
  batch_size: 20

# --- Email ---
email:
  enabled: false
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  smtp_user: ""
  smtp_password: ""       # App password for Gmail
  from_addr: ""
  to_addrs: []

# --- Web UI ---
web:
  host: "0.0.0.0"
  port: 8080
