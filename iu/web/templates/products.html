{% extends "base.html" %}
{% block title %}Products — Information Union{% endblock %}
{% block content %}
<h2 style="font-size: 18px; margin-bottom: 16px;">Tracked Products</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px;">
    {% for p in products %}
    <div class="card">
        <h3><a href="/products/{{ p.id }}">{{ p.name }}</a></h3>
        <div class="meta">
            <span>{{ p.company or '' }}</span>
            <span>{{ p.tags|join(', ') if p.tags else '' }}</span>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
