[project]
name = "information-union"
version = "0.1.0"
description = "AI industry intelligence gathering and analysis system"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "yt-dlp>=2024.0",
    "click>=8.1",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]

[project.scripts]
iu = "iu.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
